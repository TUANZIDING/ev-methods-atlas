</defs>
<rect width="980" height="670" rx="18" fill="url(#bg)"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#18484b">回收率 × 特异性：没有两全的分离方法</text>
<text x="40" y="82" font-size="15" fill="#5c6b70">Recovery vs specificity grid · 依据 MISEV2018（Théry 2018）· 位置为定性示意，随参数与样本变化</text>
<rect x="130" y="110" width="770" height="450" rx="14" fill="#ffffff" stroke="#c9d9d9" filter="url(#sh)"/>
<line x1="515.0" y1="110" x2="515.0" y2="560" stroke="#dbe6e5" stroke-dasharray="6 6"/><line x1="130" y1="335.0" x2="900" y2="335.0" stroke="#dbe6e5" stroke-dasharray="6 6"/>
