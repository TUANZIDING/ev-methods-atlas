<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 670" width="980" height="670" font-family="PingFang SC, 'Noto Sans SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
<title>回收率与特异性网格</title>
<defs>
