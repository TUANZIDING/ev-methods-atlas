<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" font-family="PingFang SC, 'Noto Sans SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
<title>差速超离步骤</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7faf9"/><stop offset="1" stop-color="#eef4f3"/></linearGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b4b4e" flood-opacity="0.12"/></filter></defs>
<rect width="1180" height="470" rx="18" fill="url(#bg)"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#18484b">差速超离步骤（KR 10-2159915 实施例 2）</text>
<text x="40" y="82" font-size="15" fill="#5c6b70">4℃ 逐级离心；转速越高沉降越小的颗粒，最后一步重复洗涤一次</text>
<rect x="40" y="150" width="201" height="150" rx="16" fill="#fff" stroke="#5d9fa2" stroke-width="2" filter="url(#sh)"/>
<text x="140" y="188" text-anchor="middle" font-size="18" font-weight="700" fill="#5d9fa2">300 ×g</text>
<text x="140" y="214" text-anchor="middle" font-size="18" font-weight="700" fill="#5d9fa2">10 min</text>
<text x="140" y="250" text-anchor="middle" font-size="15" fill="#18484b">去细胞</text>
<text x="140" y="282" text-anchor="middle" font-size="13" fill="#5c6b70">取上清</text>
<path d="M245 220 l15 9 l-15 9 z" fill="#5d9fa2"/>
<rect x="265" y="150" width="201" height="150" rx="16" fill="#fff" stroke="#4f9599" stroke-width="2" filter="url(#sh)"/>
<text x="365" y="188" text-anchor="middle" font-size="18" font-weight="700" fill="#4f9599">2,000 ×g</text>
<text x="365" y="214" text-anchor="middle" font-size="18" font-weight="700" fill="#4f9599">20 min</text>
<text x="365" y="250" text-anchor="middle" font-size="15" fill="#18484b">去细胞碎片</text>
<text x="365" y="282" text-anchor="middle" font-size="13" fill="#5c6b70">取上清</text>
<path d="M470 220 l15 9 l-15 9 z" fill="#4f9599"/>
<rect x="490" y="150" width="201" height="150" rx="16" fill="#fff" stroke="#4a9ca0" stroke-width="2" filter="url(#sh)"/>
<text x="590" y="188" text-anchor="middle" font-size="18" font-weight="700" fill="#4a9ca0">16,500 ×g</text>
<text x="590" y="214" text-anchor="middle" font-size="18" font-weight="700" fill="#4a9ca0">10 min</text>
<text x="590" y="250" text-anchor="middle" font-size="15" fill="#18484b">去微囊泡</text>
<text x="590" y="282" text-anchor="middle" font-size="13" fill="#5c6b70">取上清</text>
<path d="M694 220 l15 9 l-15 9 z" fill="#4a9ca0"/>
<rect x="714" y="150" width="201" height="150" rx="16" fill="#fff" stroke="#2f8a8f" stroke-width="2" filter="url(#sh)"/>
<text x="815" y="188" text-anchor="middle" font-size="18" font-weight="700" fill="#2f8a8f">120,000 ×g</text>
<text x="815" y="214" text-anchor="middle" font-size="18" font-weight="700" fill="#2f8a8f">120 min</text>
<text x="815" y="250" text-anchor="middle" font-size="15" fill="#18484b">沉 EV</text>
<text x="815" y="282" text-anchor="middle" font-size="13" fill="#5c6b70">弃上清、取沉淀</text>
<path d="M919 220 l15 9 l-15 9 z" fill="#2f8a8f"/>
<rect x="939" y="150" width="201" height="150" rx="16" fill="#fff" stroke="#1f6f74" stroke-width="2" filter="url(#sh)"/>
<text x="1040" y="188" text-anchor="middle" font-size="18" font-weight="700" fill="#1f6f74">120,000 ×g</text>
<text x="1040" y="214" text-anchor="middle" font-size="18" font-weight="700" fill="#1f6f74">120 min</text>
<text x="1040" y="250" text-anchor="middle" font-size="15" fill="#18484b">PBS 洗涤后再离心</text>
<text x="1040" y="282" text-anchor="middle" font-size="13" fill="#5c6b70">重悬于 PBS</text>
<rect x="40" y="330" width="1100" height="100" rx="14" fill="#eef4f3" stroke="#cfe0df"/>
<text x="58" y="360" font-size="15.5" font-weight="700" fill="#18484b">和本图谱「分离」章的对应</text>
<text x="58" y="388" font-size="13.5" fill="#253338">这是经典差速超离（dUC）：得率中等、纯度受脂蛋白/蛋白共沉淀影响。本专利把它当作读出 EV 产量的工具，而非分离创新；</text>
<text x="58" y="412" font-size="13.5" fill="#253338">若要更高纯度，可在 120,000 ×g 沉淀后接密度梯度或 SEC（见「分离方法对比」）。按 MISEV2023，单一 dUC 不足以证明是 EV，需补 EM 与多标志物。</text>
</svg>